# qouver web inside the container. Caddy on the host reverse-proxies to this port,
# so nothing here is public and nothing here terminates TLS.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The deploy script reads this before it declares a deploy good.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /healthz =404;
    }

    # Hashed build assets never change under the same name.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # adapter-static writes about.html and projects/skyward.html: a deep link
    # resolves to its .html sibling. An unknown path is a real 404 that serves
    # 404.html — try_files' last argument decides the status, so falling back to
    # /404.html itself answered 200 and turned every bad URL into a soft-404 for
    # crawlers and monitoring (found 2026-11-19 on the container, hidden by the
    # edge's handle_errors while Caddy served the tree directly).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
