# qouver web inside the container. Caddy on the host reverse-proxies to this port,
# so nothing here is public and nothing here terminates TLS.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The deploy script reads this before it declares a deploy good.
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /healthz =404;
    }

    # Hashed build assets never change under the same name.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # adapter-static writes about.html and projects/skyward.html, with 404.html as
    # the fallback: a deep link resolves to its .html sibling, an unknown path to
    # the same 404 the prerendered site already serves.
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }
}
