# qouver CI (DEPLOY-FLOW.md §5, §6, §13.3).
#
# - no paths-ignore under `on:` (rule 10; the workflow must always run so gate always reports)
# - `changes` job decides what to build; unknown paths fall through to "build"
# - `image-api` builds every PR, pushes ghcr.io/nferdazel/qouver-api:sha-<7> + :main on main,
#   keyless-signs the digest, labels the revision the host compares against the payload
# - `gate` is the single name a deploy script or branch protection ever reads
# - deploy is not a job: the repository push webhook calls /hooks/qouver, the same
#   trigger the other apps use. CI green and deploy are separate signals here.
#
# The host pulls the signed image and rotates :local / :prev; it never builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: a cancel between "push image" and "deploy" leaves the
  # host pulling an image whose build was killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Golden CI/CD contract: the same rules the server repo checks, run here so
  # drift fails this repo's own build instead of waiting for a manual audit.
  # The script is a byte-identical copy of the server repo's
  # ops/scripts/contract-check.sh; fix it there and copy it out again.
  contract:
    name: "Contract: golden CI/CD rules"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Contract: check this repo"
        run: ./ops/scripts/contract-check.sh .

  verify:
    name: Verify & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.4.2'

      - name: Install system dependencies (libpq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev

      - name: Install Nim dependencies
        run: nimble install -y -d

      - name: Install Node workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @qouver/web exec playwright install --with-deps chromium

      - name: Run verification suite (./task ci)
        run: ./task ci

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The audit reads pnpm-lock.yaml, so it needs the same toolchain the verify
      # job uses and nothing else. High and above only: a transitive low-severity
      # advisory in a dev tool must not block a release.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      # No pnpm cache here: the job audits the lockfile without installing, so
      # the store directory never exists and setup-node's post step failed the
      # job trying to save it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: "Supply chain: audit the frontend lockfile"
        run: pnpm audit --audit-level=high --prod

      # The filter decides which half is built and deployed, so it is tested with
      # the same table the workflow's `changes` job duplicates.
      - name: "Test: CI path filter table"
        run: bash ops/scripts/path-filter-test.sh

  # Decides which image halves to build (api = Nim, web = SvelteKit + nginx).
  # This never filters the workflow itself: a filtered workflow creates no
  # check-runs and a deploy gate waiting for them hangs forever. A half is built
  # unless every changed path belongs to the other half — and a path matching
  # neither list means "build both", because the failure mode of a too-narrow
  # filter is serving last week's artifact while claiming success.
  # ops/scripts/path-filter-test.sh holds the table of cases this logic must pass.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      api: ${{ steps.d.outputs.api }}
      web: ${{ steps.d.outputs.web }}
      deploy: ${{ steps.d.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what changed
        id: d
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILES=""
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            FILES="$(git diff --name-only "$BASE" "$HEAD_SHA" || true)"
          fi
          # no usable diff (force push, workflow_dispatch, unknown base) = assume everything changed
          [ -n "$FILES" ] || FILES="__all__"
          # true only when every changed path matches the pattern; __all__ never matches
          only() {
            [ "$FILES" = "__all__" ] && return 1
            ! printf '%s\n' "$FILES" | grep -qvE "$1"
          }
          api=true; web=true; deploy=true
          # cannot reach a running artifact at all: no image, no deploy
          if only '^(docs/|\.github/|[^/]*\.md$)'; then
            api=false; web=false; deploy=false
          # ops/ changes no image, but the host still has to pick the new script up
          elif only '^(docs/|\.github/|ops/|[^/]*\.md$)'; then
            api=false; web=false
          else
            only '^(apps/web/|packages/ui/|packages/api-client/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$)' && api=false
            only '^(apps/api/|shared/|modules/|qouver\.nimble$|config\.nims$)' && web=false
          fi
          { echo "api=$api"; echo "web=$web"; echo "deploy=$deploy"; } >> "$GITHUB_OUTPUT"

  # Build always, push only on main. A Dockerfile that no longer compiles is a red
  # PR instead of a red production deploy at night.
  image-api:
    name: "Image: api"
    needs: [gate, changes]
    # A push to main always publishes both tags: the deploy on the host waits for
    # api and web of the same sha, so a skipped image would strand that deploy for
    # 15 minutes and then leave the previous revision serving. PRs keep the path
    # filter to save minutes.
    #
    # `always()` leads the condition on purpose: a plain `if` on a job with
    # `needs` is also skipped when any needed job is skipped, which is how
    # cc11132 published api and stranded the host waiting for web. The gate
    # result is still required, so a red gate never publishes.
    if: always() && needs.gate.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign, this job only
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ${GITHUB_SHA::7} is bash syntax and inside `with:` there is no shell, so buildx
      # receives it literally and the tag is invalid. printf '%.7s' also matches the
      # host's `cut -c1-7` exactly, which `rev-parse --short` does not.
      - name: Short SHA
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          # GIT_REV is the full SHA on purpose: /healthz reports it and the host
          # compares it with the webhook payload's `after`.
          build-args: |
            GIT_REV=${{ github.sha }}
          tags: |
            ghcr.io/nferdazel/qouver-api:sha-${{ steps.short.outputs.sha7 }}
            ghcr.io/nferdazel/qouver-api:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nferdazel/qouver-api@${DIGEST}"

  # Same shape as image-api: builds on every PR, pushes only on main. The image is
  # not consumed yet — the quadlet exists in ops/systemd, Caddy still serves the
  # directory — so this job adds a red PR when the frontend stops containerising,
  # not a deploy.
  image-web:
    name: "Image: web"
    needs: [gate, changes]
    # Same `always()` reason as image-api: the host waits for both tags of one
    # sha, so a skip here strands the deploy.
    if: always() && needs.gate.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign, this job only
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Short SHA
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          # Baked into /healthz, which the deploy script reads back.
          build-args: |
            GIT_REV=${{ github.sha }}
          tags: |
            ghcr.io/nferdazel/qouver-web:sha-${{ steps.short.outputs.sha7 }}
            ghcr.io/nferdazel/qouver-web:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nferdazel/qouver-web@${DIGEST}"

  # The only name a deploy script or a branch protection rule reads, so the jobs
  # above can be rewritten without touching deployment.
  #
  # Gate covers the quality jobs only, never the image builds: a deploy may not
  # start before every check is green, but the image has to be published after
  # that verdict, so the two cannot wait for each other. `image-*` therefore
  # `needs: [gate]`, and the host waits for the image instead of finding one that
  # was built while the tests were still running.
  gate:
    name: Gate
    if: always()
    needs: [contract, verify, security, changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R_CONTRACT: ${{ needs.contract.result }}
      R_VERIFY: ${{ needs.verify.result }}
      R_SECURITY: ${{ needs.security.result }}
      R_CHANGES: ${{ needs.changes.result }}
    steps:
      - name: Require every job to be green
        shell: bash
        run: |
          fail=0
          for r in "$R_CONTRACT" "$R_VERIFY" "$R_SECURITY" "$R_CHANGES"; do
            [ "$r" = "success" ] || { echo "required job: $r"; fail=1; }
          done
          exit "$fail"
