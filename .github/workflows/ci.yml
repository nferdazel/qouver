# qouver CI (DEPLOY-FLOW.md §5, §6, §13.3).
#
# - no paths-ignore under `on:` (rule 10; the workflow must always run so gate always reports)
# - `changes` job decides what to build; unknown paths fall through to "build"
# - `image-api` builds every PR, pushes ghcr.io/nferdazel/qouver-api:sha-<7> + :main on main,
#   keyless-signs the digest, labels the revision the host compares against the payload
# - `gate` is the single name a deploy script or branch protection ever reads
# - `deploy` hangs off `gate` instead of the two build jobs, and also honours the filter
#
# The published image is not consumed yet: deploy-vps.sh still builds on the VPS.
# Switching the host to `podman pull <digest>` is a separate change owned by Dimas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: a cancel between "push image" and "deploy" leaves the
  # host pulling an image whose build was killed halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'

      - name: Install system dependencies (libpq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev

      - name: Install Nim dependencies
        run: nimble install -y -d

      - name: Install Node workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @qouver/web exec playwright install --with-deps chromium

      - name: Run verification suite (./task ci)
        run: ./task ci

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Decides which image halves to build. This never filters the workflow itself:
  # a filtered workflow creates no check-runs and a deploy gate waiting for them
  # hangs forever. Three answers only: both, one, neither — and a path matching
  # neither list means "build both", because the failure mode of a too-narrow
  # filter is serving last week's artifact while claiming success.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      api: ${{ steps.d.outputs.api }}
      deploy: ${{ steps.d.outputs.deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what changed
        id: d
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILES=""
          if git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            FILES="$(git diff --name-only "$BASE" "$HEAD_SHA" || true)"
          fi
          # no usable diff (force push, workflow_dispatch, unknown base) = assume everything changed
          [ -n "$FILES" ] || FILES="__all__"
          # true only when every changed path matches the pattern; __all__ never matches
          only() {
            [ "$FILES" = "__all__" ] && return 1
            ! printf '%s\n' "$FILES" | grep -qvE "$1"
          }
          api=true; deploy=true
          # cannot reach a running artifact at all: no image, no deploy
          if only '^(docs/|\.github/|[^/]*\.md$)'; then
            api=false; deploy=false
          # ops/ changes no image, but the host still has to pick the new script up
          elif only '^(docs/|\.github/|ops/|[^/]*\.md$)'; then
            api=false
          else
            only '^(apps/web/|packages/ui/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$)' && api=false
          fi
          { echo "api=$api"; echo "deploy=$deploy"; } >> "$GITHUB_OUTPUT"

  # Build always, push only on main. A Dockerfile that no longer compiles is a red
  # PR instead of a red production deploy at night.
  image-api:
    name: "Image: api"
    needs: [changes]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write        # keyless cosign, this job only
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ${GITHUB_SHA::7} is bash syntax and inside `with:` there is no shell, so buildx
      # receives it literally and the tag is invalid. printf '%.7s' also matches the
      # host's `cut -c1-7` exactly, which `rev-parse --short` does not.
      - name: Short SHA
        id: short
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: printf 'sha7=%.7s\n' "$SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          # GIT_REV is the full SHA on purpose: /healthz reports it and the host
          # compares it with the webhook payload's `after`.
          build-args: |
            GIT_REV=${{ github.sha }}
          tags: |
            ghcr.io/nferdazel/qouver-api:sha-${{ steps.short.outputs.sha7 }}
            ghcr.io/nferdazel/qouver-api:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/nferdazel/qouver-api@${DIGEST}"

  # The only name a deploy script or a branch protection rule reads, so the jobs
  # above can be rewritten without touching deployment.
  gate:
    name: Gate
    if: always()
    needs: [verify, security, changes, image-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      R_VERIFY: ${{ needs.verify.result }}
      R_SECURITY: ${{ needs.security.result }}
      R_CHANGES: ${{ needs.changes.result }}
      R_API: ${{ needs.image-api.result }}
    steps:
      - name: Require every job to be green
        shell: bash
        run: |
          fail=0
          for r in "$R_VERIFY" "$R_SECURITY" "$R_CHANGES"; do
            [ "$r" = "success" ] || { echo "required job: $r"; fail=1; }
          done
          # the image job may be skipped by the filter; anything else is a failure
          case "$R_API" in success|skipped) ;; *) echo "image job: $R_API"; fail=1 ;; esac
          exit "$fail"

  # The only deploy trigger. CI triggers a push to main once it is green, naming the
  # commit it verified; the VPS script deploys that commit and nothing else, so the
  # host never asks GitHub anything and needs no GitHub credential or rate limit.
  # The hook returns its answer only when the deploy script exits, so 200 means
  # deployed; anything else is reconciled against the public /healthz revision.
  deploy:
    name: "Deploy: trigger qouver webhook"
    needs: [gate, changes]
    if: >-
      always()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.gate.result == 'success'
      && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sign and POST the deploy trigger
        env:
          HOOK_URL: https://api.qouver.com/hooks/qouver
          HOOK_SECRET: ${{ secrets.QOUVER_HOOK_SECRET }}
          PUBLIC_HEALTH_URL: https://qouver.com/healthz
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ -z "$HOOK_SECRET" ]; then
            echo "::error::QOUVER_HOOK_SECRET is not set for this repository; refusing to deploy"
            exit 1
          fi
          printf '{"ref":"%s","after":"%s","repository":{"name":"%s"}}' \
            "$REF_NAME" "$COMMIT_SHA" "$REPO_NAME" > trigger.json
          rm -f answer.txt
          SIGNATURE="sha256=$(openssl dgst -sha256 -hmac "$HOOK_SECRET" -binary trigger.json \
            | od -An -tx1 | tr -d ' \n')"
          # 720s fits inside the 15-minute job timeout with room for the check
          # below, and is six times the longest deploy seen so far (~2 min).
          if ! CODE=$(curl -sS --max-time 720 -o answer.txt -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H 'X-GitHub-Event: push' \
            --data-binary @trigger.json "$HOOK_URL"); then
            CODE="000"
          fi
          echo "deploy hook answered HTTP $CODE for $COMMIT_SHA"
          if [ "$CODE" != "200" ]; then
            # A build slower than the call is not a failed deploy: the hook only
            # answers when the script exits, so ask the site which revision it
            # serves before calling this red. Green here still means the commit
            # is live, never that a trigger was merely accepted.
            echo "Hook did not answer 200; reconciling against $PUBLIC_HEALTH_URL"
            LIVE_REV=""
            for i in $(seq 1 18); do
              LIVE_REV=$(curl -sf --max-time 10 "$PUBLIC_HEALTH_URL" \
                | sed -n 's/.*"revision"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p' || true)
              [ "$LIVE_REV" = "$COMMIT_SHA" ] && break
              sleep 5
            done
            if [ "$LIVE_REV" = "$COMMIT_SHA" ]; then
              echo "Deploy confirmed by $PUBLIC_HEALTH_URL: revision $COMMIT_SHA is live"
              cat answer.txt 2>/dev/null || true
              exit 0
            fi
            echo "::error::Deploy not confirmed (hook HTTP $CODE, $PUBLIC_HEALTH_URL serves '${LIVE_REV:-nothing}'); a deploy may still be running on the VPS, check deploy.log"
            cat answer.txt 2>/dev/null || true
            exit 1
          fi
