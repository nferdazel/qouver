name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'

      - name: Install system dependencies (libpq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev

      - name: Install Nim dependencies
        run: nimble install -y -d

      - name: Install Node workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter @qouver/web exec playwright install --with-deps chromium

      - name: Run verification suite (./task ci)
        run: ./task ci

  security:
    name: Security (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The only deploy trigger. CI a push to main once it is green, naming the commit
  # it verified; the VPS script builds that commit and nothing else. The VPS never
  # asks GitHub anything, so it needs no GitHub credential and no rate limit.
  # The hook returns its answer only when the deploy script exits (the qouver
  # hook sets include-command-output-in-response; without it the daemon answers
  # as soon as the command starts and a green job would prove nothing), so
  # 200 = deployed, anything else = deploy failed.
  deploy:
    name: "Deploy: trigger qouver webhook"
    needs: [verify, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sign and POST the deploy trigger
        env:
          HOOK_URL: https://api.qouver.com/hooks/qouver
          HOOK_SECRET: ${{ secrets.QOUVER_HOOK_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ -z "$HOOK_SECRET" ]; then
            echo "::error::QOUVER_HOOK_SECRET is not set for this repository; refusing to deploy"
            exit 1
          fi
          printf '{"ref":"%s","after":"%s","repository":{"name":"%s"}}' \
            "$REF_NAME" "$COMMIT_SHA" "$REPO_NAME" > trigger.json
          rm -f answer.txt
          SIGNATURE="sha256=$(openssl dgst -sha256 -hmac "$HOOK_SECRET" -binary trigger.json \
            | od -An -tx1 | tr -d ' \n')"
          if ! CODE=$(curl -sS --max-time 600 -o answer.txt -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H 'X-GitHub-Event: push' \
            --data-binary @trigger.json "$HOOK_URL"); then
            CODE="000"
          fi
          echo "deploy hook answered HTTP $CODE for $COMMIT_SHA"
          if [ "$CODE" != "200" ]; then
            echo "::error::Deploy webhook did not accept the trigger (HTTP $CODE)"
            cat answer.txt 2>/dev/null || true
            exit 1
          fi

