name: Bug report
description: Something on qouver.com or in the repository is broken.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security problem here. See SECURITY.md for the private channel.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. A URL is enough for a site bug.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, route or command. For the site, the browser and whether it was desktop or mobile.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Console output, screenshots, or the commit you tested. Redact anything personal.
